name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -e ".[dev,ocr]" && pip install --no-deps "rapidocr-onnxruntime>=1.4"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy
      - run: pytest --cov --cov-fail-under=85

  # imagen de producción en GitHub Container Registry (gratis); Azure Container Apps la descarga.
  # No espera a las pruebas: la demo se puede publicar aunque una prueba esté roja.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/st-alejo/plano3d-backend:latest
            ghcr.io/st-alejo/plano3d-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
